# ===== 공통 (모든 프로필) =====
spring:
  profiles:
    active: local     # 아무 지정 없이 실행하면 local. 테스트는 @ActiveProfiles("test")로 덮어쓴다
  jpa:
    hibernate:
      ddl-auto: validate # 스키마의 원천은 Flyway(db/migration). 엔티티와 DB가 어긋나면 기동 실패로 드러낼 뿐, DB를 고치지 않는다
    open-in-view: false  # 지연로딩은 서비스 계층 안에서 끝낸다 - 켜두면 N+1을 눈치 못 챈 채 굴러감
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 기동 시 classpath:db/migration 의 V{n}__{설명}.sql 을 순서대로 적용 (Flyway → JPA 순서는 Boot가 보장). 적용된 파일은 수정 금지 - 체크섬 검증
    # Flyway 이전(ddl-auto update)에 만든 DB는 리셋이 원칙. 데이터를 보존해야 할 때만 환경변수 SPRING_FLYWAY_BASELINE_ON_MIGRATE=true 로 1회 기동 -
    # 그 DB를 V1(초기 스키마)이 적용된 상태로 간주한다 (baseline-version). README "실행법"·"운영 배포" 참고
    baseline-version: 1
  jackson:
    time-zone: UTC       # 응답의 시각은 UTC(ISO-8601) - KST 변환은 프론트 책임 (docs 결정)
  servlet:
    multipart:
      max-file-size: 10MB     # 제출 zip 한도 - 서비스 검증과 이중 (docs/submission/design.md 결정 14 - 20MB에서 축소)
      max-request-size: 15MB  # 파일 + request JSON 파트 여유분

ondal:
  upload:
    dir: ./uploads       # 제출 파일 저장 루트 - submissions/{UUID}.zip 키가 이 아래에 놓인다. S3 전환 시 FileStorage만 교체
  judge:
    # 채점 엔진 (docs judge/design.md 결정 6) - fake: 지시 주석·echo, 실행 없음 (local·test 기본, prod 기동 거부) / judge0: Judge0 HTTP (url·token 필수) / off: 엔진 없음 - 출제·저장은 되고 제출은 채점 대기(PENDING)
    engine: fake
    async: true                 # false 면 호출 스레드에서 바로 채점 - 테스트(ApiTestSupport)가 제출 직후 결과를 단언한다
    default-time-limit-ms: 2000 # 출제 폼 기본값. 과제별 값이 없을 때
    default-memory-limit-mb: 256
    max-time-limit-ms: 15000    # 폼 상한 = Judge0 MAX_CPU_TIME_LIMIT (infra/judge0/judge0.conf.example)
    max-memory-limit-mb: 512    # = MAX_MEMORY_LIMIT 524288KB
    max-test-cases: 50
    max-run-inputs: 20          # #49 출제 도구 1회 입력 수
    # FE 언어 셀렉트 문자열 → Judge0 1.13.1 language_id. 키에 공백·기호가 있어 [] 로 감싼다. 여기 없는 언어는 자동 채점 문제에 제출 불가(400)
    languages:
      "[C]": 50
      "[C++]": 54
      "[Java]": 62
      "[Python 3]": 71
      "[JavaScript]": 63
      "[TypeScript]": 74
    judge0:
      url: http://localhost:2358   # prod 는 .env JUDGE0_URL (VM 안 Judge0 - docs judge/infra.md 4절)
      token: ""                    # prod 는 .env JUDGE0_TOKEN = judge0.conf 의 AUTHN_TOKEN
      batch-size: 20               # Judge0 MAX_SUBMISSION_BATCH_SIZE 이하
      poll-interval-ms: 1000
      poll-timeout-ms: 60000
      max-attempts: 8              # 일시 장애 재시도 - 2s,4s,...256s 백오프 뒤 JUDGE_ERROR
  auth:
    # stub: loginId 만 보내면 통과 (local·test) / oidc: 홈페이지 Keycloak 로그인 (prod - 아래 prod 절에서 지정)
    # prod 프로필에서 stub 이면 StubAuthService 가 기동을 막는다 - 설정 실수로 스텁이 운영에 올라가는 사고 방지
    mode: stub

server:
  servlet:
    session:
      timeout: 12h       # 수업 하나를 버티는 길이. 서버 재시작 시 전원 로그아웃(인메모리 세션)은 P1에서 감수
      cookie:
        same-site: lax   # 다른 사이트의 <form> POST 에 세션 쿠키가 실리지 않게 (CSRF 1차 방어). 개발 중 localhost 5173, 8080 간에는 same-site 라 영향 없음
        http-only: true

logging:
  level:
    org.hibernate.SQL: debug   # 학습용 - 실행되는 SQL이 보여야 주니어가 JPA 감을 잡는다

---
# ===== local: 개발자 PC + docker compose의 PostgreSQL =====
# (test 프로필은 별도 파일 없음 - 데이터소스는 Testcontainers @ServiceConnection이 채운다)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/ondal
    username: ondal
    password: ondal-local-password   # 로컬 도커 전용 값 - 진짜 비밀은 application-local.yml(.gitignore됨)에

---
# ===== prod: 해달 서버 - docker-compose.prod.yml + .env로 실행 (Dockerfile 이미지) =====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://db:5432/ondal   # db = compose 서비스명 (컨테이너 내부 네트워크)
    username: ondal
    password: ${DB_PASSWORD}               # 서버의 .env에서 주입
  jpa:
    properties:
      hibernate:
        format_sql: false

ondal:
  judge:
    # 엔진 연결 전 기본값 off - 출제·저장은 되고 채점은 대기. Judge0(VM) 준비 후 .env 에 ONDAL_JUDGE_ENGINE=judge0, JUDGE0_URL, JUDGE0_TOKEN
    engine: ${ONDAL_JUDGE_ENGINE:off}
    judge0:
      url: ${JUDGE0_URL:}
      token: ${JUDGE0_TOKEN:}
  cors:
    # FE 커스텀 도메인이 기본값. pages.dev 미리보기 오리진은 세션 쿠키(lax)가 실리지 않아 로그인 불가 - 필요 시 .env에서 쉼표로 추가(공백 금지)
    allowed-origins: ${CORS_ORIGINS:https://ondal.haedal-sos-man-in-the-mirror.com}
  auth:
    mode: oidc   # 홈페이지 로그인(Keycloak) - OIDC 인가 코드 + PKCE, BE 가 코드 교환 (docs 결정 7). auth/oidc 패키지
    oidc:
      # OIDC_ISSUER 는 기본값 없음 - 비어 있으면 기동 실패(placeholder 미해결). 예: https://auth.haedal-sos-man-in-the-mirror.com/realms/haedal
      # BE 는 이 공개 주소로 Keycloak 에 접근한다 (Discovery·토큰 교환·JWKS - Cloudflare 경유). ID 토큰의 iss 와 정확히 같아야 한다
      issuer: ${OIDC_ISSUER}
      client-id: ${OIDC_CLIENT_ID:ondal-be}
      client-secret: ${OIDC_CLIENT_SECRET}      # Keycloak 클라이언트(confidential)의 secret - .env 에서 주입
      # Keycloak 클라이언트의 Valid redirect URIs 에 등록된 값과 문자 단위로 같아야 한다
      redirect-uri: ${OIDC_REDIRECT_URI:https://ondal-api.haedal-sos-man-in-the-mirror.com/api/auth/callback}
      # 로그인 성공 후 돌아갈 FE. 로그인 실패는 {frontend-url}/login?error=코드 로 보낸다
      frontend-url: ${FE_URL:https://ondal.haedal-sos-man-in-the-mirror.com}

server:
  # nginx(0-haedal-infra)가 보내는 X-Forwarded-Proto=https 를 신뢰 - springdoc servers URL·리다이렉트가 https 로 나간다
  # 프록시 뒤에서만 켠다 (로컬에서 켜면 클라이언트가 헤더를 위조할 수 있다)
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # FE(ondal.도메인)와 API(ondal-api.도메인)는 같은 등록 도메인 = same-site → lax 로 쿠키가 실리고 CSRF 1차 방어도 유지
        # FE를 다른 사이트(*.pages.dev 등)에서 띄울 때만 .env에서 COOKIE_SAMESITE=none (secure 필수)
        # secure=true 는 HTTPS 전제 - http://IP:8080 직접 테스트 동안만 .env에서 false 로 임시 하향
        same-site: ${COOKIE_SAMESITE:lax}
        secure: ${COOKIE_SECURE:true}

logging:
  level:
    org.hibernate.SQL: warn   # 공통 프로필의 학습용 debug를 운영에서 끔
