services:
  db:
    image: postgres:16
    container_name: ondal-db
    environment:
      POSTGRES_DB: ondal
      POSTGRES_USER: ondal
      POSTGRES_PASSWORD: ondal-local-password
    ports:
      - "5432:5432"
    volumes:
      - ondal-db-data:/var/lib/postgresql/data

volumes:
  ondal-db-data:
