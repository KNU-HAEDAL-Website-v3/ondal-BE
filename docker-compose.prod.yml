# 운영(해달 서버)용 - 로컬 개발은 기존 docker-compose.yml(DB만) 그대로 사용
#
# 트래픽 경로: Cloudflare Tunnel(cloudflared) → nginx(0-haedal-infra, :80) → 외부 도커 네트워크 ngx_to_srv → 이 컨테이너(ondal-be:8080)
#   - nginx 설정: /opt/haedal/0-haedal-infra/nginx/conf.d/ondal-api.conf (proxy_pass http://ondal-be:8080 - 컨테이너명이 곧 호스트명)
#   - TLS는 Cloudflare가 종단 - 이 컨테이너는 HTTP만 받고, 호스트 포트는 열지 않는다
#
# 서버 최초 1회:  cp .env.example .env  후 값 채우기 (.env의 COMPOSE_FILE 덕에 -f 생략 가능)
# 실행:          docker compose up -d --build
# 재배포:        git pull 후 위 명령 다시 실행 (.env만 바꿨을 때도 같은 명령 - 컨테이너를 재생성해야 반영됨)
# 로그:          docker compose logs -f ondal-be
# DB 접속:       DBeaver 등 → SSH 터널(192.168.0.3) → localhost:15432 (db 서비스 ports 주석 참고, 비밀번호는 .env DB_PASSWORD)
# 상세 절차:     README.md "운영 배포" 절

services:
  ondal-be:
    build: .
    container_name: ondal-be
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file: .env   # DB_PASSWORD 등 주입 - 주석 처리된 변수는 존재하지 않아 prod 프로필 기본값이 적용됨
    # ports 없음 - 호스트 포트를 열지 않고 nginx가 ngx_to_srv 네트워크로 직접 붙는다 (http://IP:8080 직접 노출 금지)
    expose:
      - "8080"        # 문서용 - 같은 네트워크의 nginx는 expose 없이도 접근 가능
    networks:
      - ngx_to_srv    # 0-haedal-infra의 nginx가 만든 외부 네트워크 - 없으면 기동 실패 → infra의 nginx를 먼저 띄울 것
      - default       # db와 통신하는 compose 기본 네트워크
    volumes:
      - ondal-uploads:/app/uploads   # 제출 파일은 컨테이너를 갈아끼워도 보존
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: ondal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ondal
      POSTGRES_USER: ondal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"   # 서버 루프백 전용 - DBeaver 등은 SSH 터널로 localhost:15432 접속. LAN·외부 노출 없음, app 은 여전히 내부 네트워크(db:5432) 사용
    volumes:
      - ondal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondal -d ondal"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ondal-db-data:
  ondal-uploads:

networks:
  ngx_to_srv:
    external: true
