<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판 - 수정</title>
</head>
<body>

    <h2>게시글 수정하기 ✏️</h2>

    <!-- /modifyPro 주소로 수정된 데이터를 보냅니다 -->
    <form action="/modifyPro" method="post">
        
        <!-- 💡 아주 중요한 핵심! 글 번호(id)를 안 보이게(hidden) 숨겨서 같이 보냅니다. 
             이게 있어야 서버가 '아! 새 글이 아니라 기존 글을 고치는 거구나!' 하고 알아챕니다. -->
        <input type="hidden" name="id" th:value="${crud.id}">
        
        <div>
            <label for="title">제목 : </label>
            <!-- 기존 제목을 폼 안에 미리 채워넣어 줍니다 (th:value) -->
            <input type="text" id="title" name="title" th:value="${crud.title}" required>
        </div>
        <br>
        
        <div>
            <label for="content">내용 : </label>
            <!-- 기존 내용을 폼 안에 미리 채워넣어 줍니다 (th:text) -->
            <textarea id="content" name="content" rows="5" required th:text="${crud.content}"></textarea>
        </div>
        <br>
        
        <button type="submit">수정 완료</button>
        
    </form>

</body>
</html>
