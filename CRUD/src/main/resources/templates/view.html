<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판 - 상세 보기</title>
</head>
<body>

    <h2>게시글 상세 보기 🔍</h2>
    <hr>
    
    <!-- 컨트롤러가 'crud'라는 이름으로 넘겨준 바구니에서 제목과 내용을 꺼내 씁니다 -->
    <h3 th:text="${crud.title}">여기에 제목이 들어갑니다</h3>
    <p th:text="${crud.content}">여기에 내용이 들어갑니다</p>
    
    <hr>
    <a href="/list">목록으로 돌아가기</a>
    <a th:href="@{/modify(id=${crud.id})}">✏️ 글 수정하기</a>
    <a th:href="@{/delete(id=${crud.id})}">🗑️ 글 삭제하기</a>
</body>
</html>
